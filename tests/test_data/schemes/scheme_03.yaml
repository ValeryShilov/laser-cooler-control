components:
- id: tank
  type: Tank
  name: "Накопительная емкость"
- id: pump1
  type: Pump
  name: "Насос охлаждения лазера"
- id: pump2
  type: Pump
  name: "Насос охлаждения оптики"
- id: port_in
  type: ExternalPort
  name: "Входная магистраль"
- id: port_out
  type: ExternalPort
  name: "Выходная магистраль"
connections:
- source: port_in.out
  target: tank.water_lt_in
  type: water_lt
- source: tank.water_out
  target: pump1.in
  type: water_lt
- source: tank.water_out
  target: pump2.in
  type: water_lt
- source: pump1.out
  target: port_out.in
  type: water_lt
- source: pump2.out
  target: port_out.in
  type: water_lt
