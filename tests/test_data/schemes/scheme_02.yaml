components:
- id: tank
  type: Tank
  name: "Резервуар для воды"
- id: pump
  type: Pump
  name: "Циркуляционный насос"
- id: port_in
  type: ExternalPort
  name: "Возврат воды от клиента"
- id: port_out
  type: ExternalPort
  name: "Подача воды клиенту"
connections:
- source: port_in.out
  target: tank.water_lt_in
  type: water_lt
- source: tank.water_out
  target: pump.in
  type: water_lt
- source: pump.out
  target: port_out.in
  type: water_lt
