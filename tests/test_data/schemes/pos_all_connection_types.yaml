# Все 5 типов связей (freon, freon_bypass, water_lt, water_ht, drain) в одной схеме
components:
- id: compressor_main
  type: Compressor
  name: Компрессор
- id: condenser_main
  type: Condenser
  name: Конденсатор
- id: throttle_main
  type: Throttle
  name: Дроссель
- id: valve_bypass_freon
  type: Valve
  name: Байпас фреон
- id: tank_main
  type: Tank
  name: Бак испаритель
- id: pump_water_lt
  type: Pump
  name: Насос LT
- id: pump_water_ht
  type: Pump
  name: Насос HT
- id: heater_ht
  type: Heater
  name: ТЭН контура HT
- id: port_lt_out
  type: ExternalPort
  name: Выход LT
- id: port_ht_out
  type: ExternalPort
  name: Выход HT
- id: port_drain_out
  type: ExternalPort
  name: Слив
connections:
# freon
- source: compressor_main.out
  target: condenser_main.in
  type: freon
- source: condenser_main.out
  target: throttle_main.in
  type: freon
- source: throttle_main.out
  target: tank_main.freon_in
  type: freon
- source: tank_main.freon_out
  target: compressor_main.in
  type: freon
# freon_bypass
- source: compressor_main.out
  target: valve_bypass_freon.in
  type: freon_bypass
- source: valve_bypass_freon.out
  target: tank_main.freon_in
  type: freon_bypass
# water_lt
- source: tank_main.water_out
  target: pump_water_lt.in
  type: water_lt
- source: pump_water_lt.out
  target: port_lt_out.in
  type: water_lt
# water_ht
- source: tank_main.water_out
  target: heater_ht.in
  type: water_ht
- source: heater_ht.out
  target: pump_water_ht.in
  type: water_ht
- source: pump_water_ht.out
  target: port_ht_out.in
  type: water_ht
# drain
- source: tank_main.drain
  target: port_drain_out.in
  type: drain
