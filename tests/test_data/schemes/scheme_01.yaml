components:
- id: comp
  type: Compressor
  name: "Главный компрессор"
- id: cond
  type: Condenser
  name: "Охлаждающий конденсатор"
- id: thr
  type: Throttle
  name: "Электронный дроссель"
- id: evap
  type: Tank
  name: "Бак испарителя"
connections:
- source: comp.out
  target: cond.in
  type: freon
- source: cond.out
  target: thr.in
  type: freon
- source: thr.out
  target: evap.freon_in
  type: freon
- source: evap.freon_out
  target: comp.in
  type: freon
