components:
- id: cp
  type: Compressor
  name: Компрессор
- id: cd
  type: Condenser
  name: Конденсатор
- id: th
  type: Throttle
  name: ТРВ
- id: t
  type: Tank
  name: Бак
- id: p
  type: Pump
  name: Насос
- id: h
  type: Heater
  name: Heater
- id: e
  type: ExternalPort
  name: Порт
connections:
- source: cp.out
  target: cd.in
  type: freon
- source: cd.out
  target: th.in
  type: freon
- source: th.out
  target: t.freon_in
  type: freon
- source: t.freon_out
  target: cp.in
  type: freon
- source: t.water_out
  target: p.in
  type: water_lt
- source: p.out
  target: h.in
  type: water_lt
- source: h.out
  target: e.in
  type: water_lt
- source: e.out
  target: t.water_lt_in
  type: water_lt
