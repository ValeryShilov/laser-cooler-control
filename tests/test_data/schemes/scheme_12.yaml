components:
- id: tank
  type: Tank
  name: "Основной бак"
- id: pump_lt
  type: Pump
  name: "Насос контура лазера (L)"
- id: pump_ht
  type: Pump
  name: "Насос контура оптики (H)"
- id: heater_ht
  type: Heater
  name: "ТЭН подогрева оптики"
- id: port_lt_in
  type: ExternalPort
  name: "Вход (от лазера)"
- id: port_lt_out
  type: ExternalPort
  name: "Выход (на лазер)"
- id: port_ht_in
  type: ExternalPort
  name: "Вход (от оптики)"
- id: port_ht_out
  type: ExternalPort
  name: "Выход (на оптику)"
connections:
- source: port_lt_in.out
  target: tank.water_lt_in
  type: water_lt
- source: tank.water_out
  target: pump_lt.in
  type: water_lt
- source: pump_lt.out
  target: port_lt_out.in
  type: water_lt
- source: port_ht_in.out
  target: tank.water_ht_in
  type: water_ht
- source: tank.water_out
  target: pump_ht.in
  type: water_ht
- source: pump_ht.out
  target: heater_ht.in
  type: water_ht
- source: heater_ht.out
  target: port_ht_out.in
  type: water_ht
