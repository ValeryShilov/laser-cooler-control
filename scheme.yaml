components:
  - id: compressor_main
    type: Compressor
    name: "Компрессор"
  - id: condenser_unit
    type: Condenser
    name: "Конденсатор"
  - id: fan_cooling
    type: Fan
    name: "Вентилятор"
  - id: throttle
    type: Throttle
    name: "Дроссель"
  - id: valve_bypass
    type: Valve
    name: "Клапан Байпаса"
  - id: tank_evaporator
    type: Tank
    name: "Бак и Испаритель"
  - id: pump_circulating
    type: Pump
    name: "Насос"
  - id: heater_optics
    type: Heater
    name: "ТЭН"
  - id: port_laser_in
    type: ExternalPort
    name: "Вход L (Лазер)"
  - id: port_optics_in
    type: ExternalPort
    name: "Вход H (Оптика)"
  - id: port_optics_out
    type: ExternalPort
    name: "Выход H (Оптика)"
  - id: port_laser_out
    type: ExternalPort
    name: "Выход L (Лазер)"
  - id: port_drain_system
    type: ExternalPort
    name: "Слив"

connections:
  - source: compressor_main.out
    target: condenser_unit.in
    type: freon
  - source: condenser_unit.out
    target: throttle.in
    type: freon
  - source: throttle.out
    target: tank_evaporator.freon_in
    type: freon
  - source: tank_evaporator.freon_out
    target: compressor_main.in
    type: freon
  - source: compressor_main.out
    target: valve_bypass.in
    type: freon_bypass
  - source: valve_bypass.out
    target: tank_evaporator.freon_in
    type: freon_bypass
  - source: port_laser_in.out
    target: tank_evaporator.water_ht_in
    type: water_lt
  - source: port_optics_in.out
    target: tank_evaporator.water_lt_in
    type: water_ht    
  - source: tank_evaporator.water_out
    target: pump_circulating.in
    type: water_lt
  - source: pump_circulating.out
    target: port_laser_out.in
    type: water_lt
  - source: pump_circulating.out
    target: heater_optics.in
    type: water_ht
  - source: heater_optics.out
    target: port_optics_out.in
    type: water_ht
  - source: tank_evaporator.drain
    target: port_drain_system.in
    type: drain
  - source: fan_cooling
    target: condenser_unit
    type: mechanical